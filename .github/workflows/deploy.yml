name: Deploy Backend to VPS

on:
  push:
    branches: [ master ] # dispara sempre que entrar codigo na branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Faz checkout do codigo no servidor do GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o ambiente Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Compila e gera o .jar de producao
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests -B

      # 4. Envia o .jar para a VPS via SCP seguro
      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "target/backend-0.0.1-SNAPSHOT.jar"
          target: "/tmp/"
          strip_components: 1

      # 5. Move para a pasta final e reinicia o servico no systemd
      - name: Deploy and Restart Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo mv /tmp/backend-0.0.1-SNAPSHOT.jar /opt/sales-backend/app.jar
            sudo chown appuser:appuser /opt/sales-backend/app.jar
            sudo systemctl restart sales-backend
            echo "Deploy finalizado com sucesso!"