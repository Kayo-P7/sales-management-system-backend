spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: sales-management-system-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

server:
  port: 8089

jwt:
  secret: ${JWT_SECRET}