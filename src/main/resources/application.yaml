server:
  port: ${SERVER_PORT:8089}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: sales-management-system-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5439/sales_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
    baseline-description: "baseline_inicial"
    locations: classpath:db/migration


api:
  security:
    token:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth:
      capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
      refill-tokens: ${RATE_LIMIT_AUTH_REFILL_TOKENS:10}
      refill-duration-in-seconds: ${RATE_LIMIT_AUTH_DURATION:60}
    general:
      capacity: ${RATE_LIMIT_GENERAL_CAPACITY:60}
      refill-tokens: ${RATE_LIMIT_GENERAL_REFILL_TOKENS:60}
      refill-duration-in-seconds: ${RATE_LIMIT_GENERAL_DURATION:60}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
