server:
  port: ${SERVER_PORT}
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: sales-management-system-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE}
    baseline-version: ${FLYWAY_BASELINE_VERSION}
    baseline-description: "baseline_inicial"
    locations: classpath:db/migration

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

api:
  security:
    token:
      secret: ${JWT_SECRET}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED}
    auth:
      capacity: ${RATE_LIMIT_AUTH_CAPACITY}
      refill-tokens: ${RATE_LIMIT_AUTH_REFILL_TOKENS}
      refill-duration-in-seconds: ${RATE_LIMIT_AUTH_DURATION}
    general:
      capacity: ${RATE_LIMIT_GENERAL_CAPACITY}
      refill-tokens: ${RATE_LIMIT_GENERAL_REFILL_TOKENS}
      refill-duration-in-seconds: ${RATE_LIMIT_GENERAL_DURATION}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
