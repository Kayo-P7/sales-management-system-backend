upstream backend_servers {
    server backend:8089;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # oculta a versao do nginx por seguranca
    server_tokens off;

    # tamanho maximo do corpo da requisicao
    client_max_body_size 10M;

    # tempos limites para mitigar ataques de slowloris
    client_body_timeout 12s;
    client_header_timeout 12s;

    # encaminhamento do trafego para a api spring boot
    location / {
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;

        # mantem conexoes http/1.1 ativas com o upstream
        proxy_set_header Connection "";

        # sanitiza cabecalhos contra ip spoofing descartando headers forjados externos
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # timeouts de conexao com o backend
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
